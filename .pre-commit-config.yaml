# .pre-commit-config.yaml
repos:
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-black
        files: \.ipynb$
        args: [--line-length=100]
        additional_dependencies:
          - black==24.8.0
      - id: nbqa-isort
        files: \.ipynb$
        args: [--profile=black]
        additional_dependencies:
          - isort==5.13.2
      - id: nbqa-ruff
        files: \.ipynb$
        args: [--fix]
        additional_dependencies:
          - ruff==0.6.9

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        files: \.py$
        args: [--fix]
      - id: ruff-format
        files: \.py$

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        files: \.py$
        args: [--line-length=100]
