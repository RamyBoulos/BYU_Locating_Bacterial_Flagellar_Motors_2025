[project]
name = "byu2-motor-localization"
version = "0.1.0"
description = "3D U-Net pipeline for localizing bacterial flagellar motors"
authors = [
    {name = "Ramy Boulos"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch (>=2.8.0,<3.0.0)",
    "numpy (>=2.3.2,<3.0.0)",
    "tifffile (>=2025.8.28,<2026.0.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "augmend (>=0.1.3,<0.2.0)",
    "scikit-image (>=0.25.2,<0.26.0)",
    "scikit-learn (>=1.7.1,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "matplotlib (>=3.10.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"
ipykernel = "^6.30.1"

